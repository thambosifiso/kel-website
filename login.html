<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Client Login | KEL</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="section">
    <div class="container" style="max-width:520px;">
      <div class="card">
        <h3>Client Login</h3>
        <p class="lead">Create an account or log in to access the client area.</p>

        <div class="form">

          <!-- ✅ REQUIRED FOR CREATE ACCOUNT -->
          <input class="input" id="firstName" type="text" placeholder="First Name" />
          <input class="input" id="lastName" type="text" placeholder="Surname" />

          <!-- EMAIL -->
          <input class="input" id="email" type="email" placeholder="Email Address" required />

          <!-- PASSWORD -->
          <input class="input" id="password" type="password"
            placeholder="Password (min 8 chars, upper, lower, number, symbol)" required />

          <button class="btn primary" onclick="login()">Login</button>
          <button class="btn ghost" onclick="signup()">Create Account</button>

          <small style="color:var(--muted); line-height:1.6;">
            Creating an account requires First Name + Surname.
          </small>
        </div>

        <div style="margin-top:14px;">
          <a class="btn ghost" href="index.html">Back to Website</a>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="auth.js"></script>
</body>
</html>
